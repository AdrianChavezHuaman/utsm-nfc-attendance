<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ea">
  <title>{% block title %}Control de Asistencia · UTSM{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
  {% block styles %}{% endblock %}
</head>
<body class="public-body {% block body_class %}{% endblock %}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
