{#- Íconos SVG inline (trazo, 24x24) -#}
{% macro icon(name, size=20, extra_class='') -%}
<svg class="icon {{ extra_class }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'logo' -%}
    <rect x="2.8" y="5" width="18.4" height="14" rx="3.4"/>
    <circle cx="8.4" cy="11.2" r="2"/>
    <path d="M5.6 16.2c.5-1.5 1.5-2.3 2.8-2.3s2.3.8 2.8 2.3"/>
    <path d="M14.5 10.2h3.8M14.5 13.6h3.8"/>
  {%- elif name == 'mail' -%}
    <rect x="3" y="5.5" width="18" height="13" rx="2.5"/>
    <path d="m4.5 7.5 7.5 5.3 7.5-5.3"/>
  {%- elif name == 'lock' -%}
    <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.4"/>
    <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
    <path d="M12 14.4v2"/>
  {%- elif name == 'eye' -%}
    <path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12Z"/>
    <circle cx="12" cy="12" r="2.9"/>
  {%- elif name == 'eye-off' -%}
    <path d="M4 4.5 20 20"/>
    <path d="M10.6 6.1A9.7 9.7 0 0 1 12 6c6 0 9.4 6 9.4 6a17 17 0 0 1-3.3 3.8M7.2 7.7A16.4 16.4 0 0 0 2.6 12S6 18 12 18a9.4 9.4 0 0 0 3.7-.8"/>
    <path d="M9.9 10.2a3 3 0 0 0 4.1 4.1"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M4.5 12h15M13.5 6l6 6-6 6"/>
  {%- elif name == 'arrow-left' -%}
    <path d="M19.5 12h-15M10.5 6l-6 6 6 6"/>
  {%- elif name == 'home' -%}
    <path d="m3.5 10.5 8.5-7 8.5 7"/>
    <path d="M5.5 9.2v10.3h13V9.2"/>
    <path d="M10 19.5v-5.2h4v5.2"/>
  {%- elif name == 'scan' -%}
    <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
    <path d="M7.5 12h9"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 7.4V12l3.1 1.9"/>
  {%- elif name == 'alert' -%}
    <path d="M12 3.8 21 19.4H3L12 3.8Z"/>
    <path d="M12 9.4v4.3M12 16.6v.1"/>
  {%- elif name == 'chart' -%}
    <path d="M4 20V4"/>
    <path d="M4 20h16"/>
    <path d="M7.5 15.5v-4M12 15.5V7.8M16.5 15.5v-6"/>
  {%- elif name == 'file' -%}
    <path d="M13.5 3.5H6.8A1.8 1.8 0 0 0 5 5.3v13.4a1.8 1.8 0 0 0 1.8 1.8h10.4a1.8 1.8 0 0 0 1.8-1.8V8.5Z"/>
    <path d="M13.5 3.5v5h5M8.5 13h7M8.5 16.4h5"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3.2 20 6v5.3c0 4.7-3.2 8-8 9.5-4.8-1.5-8-4.8-8-9.5V6Z"/>
    <path d="m8.8 12 2.2 2.2 4.4-4.4"/>
  {%- elif name == 'users' -%}
    <circle cx="9" cy="8.4" r="3.2"/>
    <path d="M3.6 19.2c.6-3 2.6-4.6 5.4-4.6s4.8 1.6 5.4 4.6"/>
    <path d="M15.2 5.6a3 3 0 0 1 0 5.7M17 14.9c1.9.6 3 2 3.5 4.3"/>
  {%- elif name == 'settings' -%}
    <circle cx="12" cy="12" r="3.1"/>
    <path d="M19.2 13.5a7.7 7.7 0 0 0 0-3l1.7-1.3-1.9-3.3-2 .8a7.6 7.6 0 0 0-2.6-1.5L14 3h-4l-.4 2.2A7.6 7.6 0 0 0 7 6.7l-2-.8-1.9 3.3 1.7 1.3a7.7 7.7 0 0 0 0 3l-1.7 1.3 1.9 3.3 2-.8a7.6 7.6 0 0 0 2.6 1.5L10 21h4l.4-2.2a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.9-3.3Z"/>
  {%- elif name == 'logout' -%}
    <path d="M14.5 8V6.3A1.8 1.8 0 0 0 12.7 4.5H6.3A1.8 1.8 0 0 0 4.5 6.3v11.4a1.8 1.8 0 0 0 1.8 1.8h6.4a1.8 1.8 0 0 0 1.8-1.8V16"/>
    <path d="M9.5 12h10M16.5 9l3 3-3 3"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'x' -%}
    <path d="m6 6 12 12M18 6 6 18"/>
  {%- elif name == 'check' -%}
    <path d="m5 12.5 4.4 4.4L19 7.5"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 11v5M12 8v.1"/>
  {%- elif name == 'calendar' -%}
    <rect x="3.8" y="5.2" width="16.4" height="15" rx="2.4"/>
    <path d="M3.8 9.6h16.4M8.2 3.5v3.4M15.8 3.5v3.4"/>
  {%- elif name == 'building' -%}
    <path d="M4.5 20.5v-15a1.5 1.5 0 0 1 1.5-1.5h8a1.5 1.5 0 0 1 1.5 1.5v15"/>
    <path d="M15.5 9.5h3a1 1 0 0 1 1 1v10M3 20.5h18"/>
    <path d="M8 7.5h1.5M8 11h1.5M8 14.5h1.5M12 7.5h1.5M12 11h1.5M12 14.5h1.5"/>
  {%- elif name == 'layers' -%}
    <path d="m12 3.5 8.5 4.6L12 12.7 3.5 8.1Z"/>
    <path d="m3.5 12.4 8.5 4.6 8.5-4.6M3.5 16.7l8.5 4.6 8.5-4.6"/>
  {%- elif name == 'card' -%}
    <rect x="2.8" y="5.5" width="18.4" height="13" rx="2.6"/>
    <path d="M2.8 9.6h18.4M6.5 14.5h3.5"/>
  {%- elif name == 'spark' -%}
    <path d="M12 3.5 13.8 9l5.5 1.8-5.5 1.8L12 18.1l-1.8-5.5L4.7 10.8 10.2 9Z"/>
  {%- endif -%}
</svg>
{%- endmacro %}
