<dl class="incident-summary" aria-label="Resumen de justificaciones">
  <div class="incident-summary-cell">
    <dt>Sin justificar</dt>
    <dd>{{ resumen.sin_justificar }}</dd>
    <span>Requieren sustento</span>
  </div>
  <div class="incident-summary-cell">
    <dt>En revisión</dt>
    <dd>{{ resumen.en_revision }}</dd>
    <span>Esperan al coordinador</span>
  </div>
  <div class="incident-summary-cell">
    <dt>Aprobadas</dt>
    <dd>{{ resumen.aprobadas }}</dd>
    <span>Incidencia justificada</span>
  </div>
  <div class="incident-summary-cell">
    <dt>Rechazadas</dt>
    <dd>{{ resumen.rechazadas }}</dd>
    <span>Pueden reenviarse</span>
  </div>
</dl>
